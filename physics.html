<!DOCTYPE html>
<html>
    <head>
        <link href = "physics.css" rel = "stylesheet"/>
        <script src = "physics.js" defer></script>
        <title>Physics</title>
        <meta charset = "UTF-8"/>
    </head>
    <body class = "body">
        <button id = "startButton"; class = "startButton">Start</button>
        <button id = "stopButton"; class = "stopButton">Stop</button>
        <div id = "container"; class = "container">
            <div class = "grid1"></div>
            <div class = "grid2"></div>
            <div class = "grid3"></div>
            <div class = "grid4"></div>
            <div class = "grid5"></div>
            <div class = "grid6"></div>
            <div class = "grid7"></div>
            <div class = "grid8"></div>
            <div class = "grid9"></div>
            <div class = "grid10"></div>
            <div class = "grid11"></div>
            <div class = "grid12"></div>
            <div class = "grid13"></div>
            <div class = "grid14"></div>
            <div class = "grid15"></div>
            <div class = "grid16"></div>
            <div class = "grid17"></div>
            <div id = "blueBall"; class = "blueBall"></div>
            <div id = "redBall"; class = "redBall"></div>
            <div id = "greenBall"; class = "greenBall"></div>
        </div>
        <hr class = "keyVisual"/>
        <p class = "keyText">100 pixels = 1 meter</p>
        <p class = "keyText">Total energy (Joules):</p>
        <p id = "energy"; class = "keyText">BROKEN</p>
        <p class = "keyText">Speeds (m/s):</p>
        <p id = "speed"; class = "keyText">--</p>
        <p class = "keyText">Positions (m):</p>
        <p id = "position"; class = "keyText">--</p>
        <p class = "keyText">Time (s):</p>
        <p id = "time"; class = "keyText">--</p>
    </body>
</html>
