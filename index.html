<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>collision sim</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body class="body">
    <header class="topbar">
      <div class="buttons">
        <button id="startButton" class="startButton" type="button">Start</button>
        <button id="stopButton" class="stopButton" type="button">Stop</button>
      </div>
    </header>

    <main class="main">
      <div id="container" class="container" aria-label="Simulation area">
        <div id="blueBall" class="ball ball--blue"></div>
        <div id="redBall" class="ball ball--red"></div>
        <div id="greenBall" class="ball ball--green"></div>
      </div>

      <section class="readouts">
        <hr class="keyVisual" />
        <p class="keyText" id="scaleLabel">--</p>

        <p class="keyText">Total energy (Joules):</p>
        <p id="energy" class="keyText">--</p>

        <p class="keyText">Speeds (m/s):</p>
        <p id="speed" class="keyText">--</p>

        <p class="keyText">Positions (m):</p>
        <p id="position" class="keyText">--</p>

        <p class="keyText">Time (s):</p>
        <p id="time" class="keyText">--</p>
      </section>
    </main>
  </body>
</html>
